# Isolated regression tests only. This file is never packaged in the application.
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:regression;MODE=MSSQLServer;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
logging.level.org.springframework.jdbc=INFO
logging.level.com.eventsphere=INFO
spring.devtools.restart.enabled=false
