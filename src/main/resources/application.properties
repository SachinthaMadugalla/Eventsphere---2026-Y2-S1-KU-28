# =====================================================
# EventSphere - Application Configuration
# SE2030 Group 2026-Y2-S1-KU-28
# =====================================================

# Application name
spring.application.name=EventSphere

# Server port (change if 8080 is already in use)
server.port=${SERVER_PORT:8080}
server.address=127.0.0.1

# =====================================================
# Microsoft SQL Server Database Configuration
# Windows authentication is the default. The launcher loads .local/database.json.
# Use DB_INTEGRATED_SECURITY=false with DB_USERNAME/DB_PASSWORD for SQL logins.
# =====================================================
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:EventSphereDB};encrypt=true;trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true};integratedSecurity=${DB_INTEGRATED_SECURITY:true};loginTimeout=10
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.validation-timeout=5000

# =====================================================
# JSP View Resolver Configuration
# =====================================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# =====================================================
# Disable automatic schema initialization via Spring
# We use our own schema.sql run manually in SSMS
# =====================================================
spring.sql.init.mode=never

# =====================================================
# Logging (keep at INFO for student use)
# =====================================================
logging.level.com.eventsphere=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.root=INFO

# =====================================================
# File upload settings
# =====================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================
# Session timeout (30 minutes)
# =====================================================
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
