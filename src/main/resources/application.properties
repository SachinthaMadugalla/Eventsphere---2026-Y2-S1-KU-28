# =====================================================
# EventSphere - Application Configuration
# SE2030 Group 2026-Y2-S1-KU-28
# =====================================================

# Application name
spring.application.name=EventSphere

# Server port (change if 8080 is already in use)
server.port=8080

# =====================================================
# Microsoft SQL Server Database Configuration
# IMPORTANT: Replace YOUR_SQL_SERVER_PASSWORD with
# your actual SQL Server password before running.
# =====================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=EventSphereDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Eventsphere@2026
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# =====================================================
# JSP View Resolver Configuration
# =====================================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# =====================================================
# Disable automatic schema initialization via Spring
# We use our own schema.sql run manually in SSMS
# =====================================================
spring.sql.init.mode=never

# =====================================================
# Logging (keep at INFO for student use)
# =====================================================
logging.level.com.eventsphere=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.root=INFO

# =====================================================
# File upload settings
# =====================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================
# Session timeout (30 minutes)
# =====================================================
server.servlet.session.timeout=30m
